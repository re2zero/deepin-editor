name: edinsert_suite
app: deepin-editor
module: edinsert
vars:
  TEST_FILES_DIR: ${PROJECT_ROOT}/tests/at/files/

setup:
- action: session_start
  command: |
    bash -lc 'rm -r ~/.local/share/deepin/deepin-editor/blank-files/; sleep 1.0;'
    deepin-editor
  wait: 3.0
suites:
- id: suite_edinsert_B08_001_s1
  name: 切换编码_数据错误提示
  description: '覆盖原始用例：1592811（P1）；
  status: unsupported
  reason: >-执行编码切换操作（打开 gb18030_test.txt 后切换 GB18030→UTF-16BE），后续用例依赖该文件打开状态。
    原期望的"数据错误提示"弹窗在应用中不存在（切换后静默显示乱码，无对话框；源码 bottombar.cpp:139 与视觉实测 2026-09-17 均确认），故执行操作但不断言弹窗'
  steps:
  - step_type: action
    action: dtk_main_menu
    selector:
      name: OptionMenu
      role: menu
    items:
    - 打开文件
    wait: 1.0
  - step_type: action
    action: file_dialog_select
    path: ${TEST_FILES_DIR}/
    name: gb18030_test.txt
    wait: 3.0
  - step_type: action
    action: element_action
    do: click
    selector:
      accessible_id: PToolButton
      index: 2
    note: 底栏 4 个 DDropdownMenu 按钮 accessible-id 均为 ...DDropdownMenu.PToolButton（setObjectName，ddropdownmenu.cpp:60），accessible-name 均为 DropdownToolButton（setAccessibleName，:59）；index=2 为树序第 3 个=编码按钮（2026-09-17 实测 AT-SPI click 打开编码菜单）。不用 dtk_dropdown_menu：其导航只按 Down 遍历顶层分组，无法打开 Unicode 子菜单选到 UTF-16BE
    wait: 0.5
  - step_type: action
    action: keyboard_press
    key: Down
    note: 高亮首个分组 Unicode
    wait: 0.3
  - step_type: action
    action: keyboard_press
    key: Right
    note: 展开 Unicode 子菜单（首项 UTF-8 高亮）
    wait: 0.5
  - step_type: action
    action: keyboard_press
    key: Down
    note: 高亮 UTF-16BE（encodes.ini 顺序：UTF-8,UTF-16BE,UTF-16LE,UTF-32BE,UTF-32LE）
    wait: 0.3
  - step_type: action
    action: keyboard_press
    key: Return
    note: 选中 UTF-16BE；应用无错误弹窗，静默切换并显示乱码（原用例期望的"数据错误提示"不存在，故不断言）
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: TextEditor
      role: text

- id: suite_edinsert_B08_002_s1
  name: 文件内容_Insert覆盖输入
  description: '覆盖原始用例：1592807（P2）'
  steps:
  - step_type: action
    action: keyboard_type_text
    text: hello world
    wait: 0.5
  - step_type: action
    action: keyboard_hot_key
    key: Home
    wait: 0.3
  - step_type: action
    action: keyboard_hot_key
    key: Right
    wait: 0.2
  - step_type: action
    action: keyboard_hot_key
    key: Right
    wait: 0.2
  - step_type: action
    action: keyboard_hot_key
    key: Right
    wait: 0.2
  - step_type: action
    action: keyboard_hot_key
    key: Right
    wait: 0.2
  - step_type: action
    action: keyboard_hot_key
    key: Right
    wait: 0.2
  - step_type: action
    action: keyboard_hot_key
    key: Insert
    wait: 0.3
  - step_type: action
    action: keyboard_type
    text: X
    wait: 0.3
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: TextEditor
      role: text

teardown:
- action: session_stop
