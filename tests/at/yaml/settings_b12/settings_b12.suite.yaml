name: settings_b12_suite
app: deepin-editor
description: '设置-窗口设置 (B12)'
module: settings_b12
tags: []
fast_fail: false
env_check: []
setup:
- action: session_start
  command: deepin-editor
  wait: 3.0
suites:
- id: case_1593057_s1
  name: 窗口设置_新窗口路径
  description: '设置新窗口默认打开路径'
  tags: []
  steps:
  - action: element_action
    selector:
      accessible_id: Menu_2
    do: click
  - action: element_action
    selector:
      accessible_id: Settings
    do: click
  - action: element_action
    selector:
      name: 高级设置
      role: list item
    do: click
  - action: element_action
    selector:
      name: 打开/保存设置
      role: panel
    do: click
  - action: keyboard_type
    text: /tmp
  - action: element_action
    selector:
      name: 确定
      role: push button
    do: click
  assert_steps:
  - action: assert_element
    selector:
      name: MainWindow
      role: frame
- id: case_1593053_s1
  name: 窗口设置_关闭应用保留现场
  description: '勾选关闭应用保留现场后关闭重开验证恢复'
  tags: []
  steps:
  - action: element_action
    selector:
      accessible_id: Menu_2
    do: click
  - action: element_action
    selector:
      accessible_id: Settings
    do: click
  - action: element_action
    selector:
      name: 高级设置
      role: list item
    do: click
  - action: element_action
    selector:
      name: 启动
      role: panel
    do: click
  - action: element_action
    selector:
      name: 保留关闭前的页签
      role: check box
    do: click
  - action: element_action
    selector:
      name: 确定
      role: push button
    do: click
  - action: keyboard_hot_key
    key: alt+f4
  - action: session_start
    command: deepin-editor
    wait: 3.0
  assert_steps:
  - action: assert_element
    selector:
      name: MainWindow
      role: frame
- id: case_1593071_s1
  name: 窗口设置
  description: '调整窗口相关选项并应用'
  tags: []
  steps:
  - action: element_action
    selector:
      accessible_id: Menu_2
    do: click
  - action: element_action
    selector:
      accessible_id: Settings
    do: click
  - action: element_action
    selector:
      name: 高级设置
      role: list item
    do: click
  - action: element_action
    selector:
      name: 窗口状态
      role: combo box
    do: click
  - action: keyboard_press
    key: down
  - action: keyboard_press
    key: enter
  - action: element_action
    selector:
      name: 确定
      role: push button
    do: click
  assert_steps:
  - action: assert_element
    selector:
      name: MainWindow
      role: frame
teardown:
- action: session_stop
