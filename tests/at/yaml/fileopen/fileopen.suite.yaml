- id: suite_fileopen_B03_003_s1
  name: 打开crt格式文件_正常打开
  description: '覆盖原始用例：1593091（P2，冒烟）'
  steps:
  - step_type: action
    action: dtk_main_menu
    selector:
      name: OptionMenu
      role: menu
    items:
    - 打开文件
    wait: 1.0
  - step_type: action
    action: file_dialog_select
    path: ${TEST_FILES_DIR}/
    name: test_cert.crt
    wait: 3.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: TextEditor
      role: text

- id: suite_fileopen_B03_004_s1
  name: 打开GB18030编码文件_正确识别
  description: '覆盖原始用例：1593093（P1）'
  steps:
  - step_type: action
    action: dtk_main_menu
