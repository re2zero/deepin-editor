- id: suite_工作区_049_s1
  name: 切换大小写&撤销的交互
  description: ''
  steps:
  - step_type: action
    action: keyboard_hot_key
    key: Ctrl+T
  - step_type: action
    action: keyboard_type_text
    text: 'hello world test

      '
  - step_type: action
    action: keyboard_hot_key
    key: Ctrl+A
  - step_type: action
    action: dtk_context_menu
    selector:
      name: TextEditor
      role: text
    items:
    - 切换大小写
    - 大写
  - step_type: action
    action: keyboard_hot_key
    key: Ctrl+Z
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: TextEditor
      role: text

- id: suite_工作区_052_s1
  name: 替换_查询结果包含大小写
  description: ''
  steps:
  - step_type: action
    action: keyboard_type_text
    text: 'A and a and A text

      '
  - step_type: action
    action: keyboard_hot_key
    key: Ctrl+H
    wait: 1.0
  - step_type: action
    action: element_set_value
    selector:
      name: ReplaceFindInput
    text: A
  - step_type: action
    action: element_set_value
    selector:
      name: ReplaceWithInput
    text: X
  - step_type: action
    action: element_action
    selector:
      name: ReplaceNext
      role: push button
    do: click
  - step_type: action
    action: element_action
    selector:
      name: ReplaceNext
      role: push button
    do: click
  - step_type: action
    action: element_action
    selector:
      name: ReplaceAll
      role: push button
    do: click
  assert_steps:
  # - step_type: assert
  #   action: assert_element
  #   selector:
  #     name: ReplaceFindInput
  - step_type: assert
    action: assert_element
    selector:
      name: TextEditor
      role: text

teardown:
- action: session_stop
