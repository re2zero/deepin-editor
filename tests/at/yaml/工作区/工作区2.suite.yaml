name: 工作区_suite
app: deepin-editor
module: 工作区
setup:
- action: session_start
  command: |
    bash -lc 'rm -r ~/.local/share/deepin/deepin-editor/blank-files/; sleep 1.0;'
    deepin-editor ${TEST_FILES_DIR}/sample_code.c
  wait: 3.0
