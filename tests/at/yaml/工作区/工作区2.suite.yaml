- id: suite_工作区_043_s1
  name: 不同源代码文件注释
  description: ''
  steps:
  - step_type: action
    action: keyboard_hot_key
    key: Ctrl+O
    wait: 1.0
  - step_type: action
    action: file_dialog_select
    path: ${TEST_FILES_DIR}/sample_code.c
  - step_type: action
    action: keyboard_press
    key: escape
  - step_type: action
    action: dtk_context_menu
    selector:
      name: TextEditor
      role: text
    items:
    - 添加注释
  # - step_type: action
  #   action: keyboard_hot_key
  #   key: Ctrl+A
  # - step_type: action
  #   action: dtk_context_menu
  #   selector:
  #     name: TextEditor
  #     role: text
  #   items:
  #   - 添加注释
  - step_type: action
    action: keyboard_hot_key
    key: Ctrl+Z
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: TextEditor
      role: text

