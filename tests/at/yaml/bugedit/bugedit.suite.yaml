  - step_type: action
    action: keyboard_type_text
    text: hello
    wait: 0.3
  - step_type: action
    action: keyboard_press
    key: tab
    wait: 0.3
  - step_type: action
    action: keyboard_type_text
    text: hi
    wait: 0.3
  - step_type: action
    action: element_action
    selector:
      name: ReplaceAll
      role: push button
    do: click
    wait: 0.5
  - step_type: action
    action: keyboard_press
    key: escape
    wait: 0.3
  - step_type: action
    action: keyboard_hot_key
    key: Ctrl+A
    wait: 0.3
  - step_type: action
    action: keyboard_type_text
    text: 'hello world hello test hello'
    wait: 0.5
  - step_type: action
    action: keyboard_hot_key
    key: Ctrl+A
    wait: 0.3
  - step_type: action
    action: dtk_context_menu
    selector:
      name: TextEditor
