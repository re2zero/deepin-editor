name: 主菜单_suite
app: deepin-editor
module: 主菜单
vars:
  TEST_FILES_DIR: ${PROJECT_ROOT}/tests/at/files/

setup:
- action: session_start
  command: |
    echo "clear tmp files in testfiles_dir: ${TEST_FILES_DIR}"
    bash -lc 'rm -r ~/.local/share/deepin/deepin-editor/blank-files/; sleep 1.0;'
    bash -lc 'rm -rf ${TEST_FILES_DIR}/未命名文档*; sleep 1.0;'
    deepin-editor
  wait: 3.0
suites:
- id: suite_主菜单_007_s1
  name: 自定义操作路径_保存一个未保存过的新文档
  description: ''
  steps:
  - step_type: action
    action: keyboard_hot_key
    key: Ctrl+T
  - step_type: action
    action: keyboard_type_text
    text: custom path save test
  - step_type: action
    action: dtk_main_menu
    selector:
      name: OptionMenu
      role: menu
    items:
    - 另存为
    wait: 1.0
  - step_type: action
    action: file_dialog_cancel
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: TextEditor
      role: text

- id: suite_主菜单_008_s1
  name: 设置按钮
  description: ''
  steps:
  - step_type: action
    action: dtk_main_menu
    selector:
      name: OptionMenu
      role: menu
    items:
    - 设置
    wait: 1.0
  - step_type: action
    action: keyboard_press
    key: escape
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: TextEditor
      role: text
- id: suite_主菜单_022_s1
  name: 查找_按压enter键
  description: ''
  steps:
  - step_type: action
    action: keyboard_type
    text: 'find target

      find target

      other'
  - step_type: action
    action: keyboard_hot_key
    key: Ctrl+F
  - step_type: action
    action: keyboard_type
    text: find
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: FindNext
      role: push button
    do: click
  - step_type: action
    action: element_action
    selector:
      name: FindPrevious
      role: push button
    do: click
  - step_type: action
    action: element_action
    selector:
      name: CloseFind
    do: click
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: TextEditor
      role: text

- id: suite_主菜单_024_s1
  name: 新建标签
  description: ''
  steps:
  - step_type: action
    action: dtk_main_menu
    selector:
      name: OptionMenu
      role: menu
    items:
    - 新标签页
    wait: 1.0
  - step_type: action
    action: keyboard_type
    text: tab content test
  - step_type: action
    action: keyboard_hot_key
    key: Ctrl+W
  - step_type: action
    action: keyboard_press
    key: escape
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: TextEditor
      role: text
  # - step_type: assert
  #   action: assert_element
  #   selector:
  #     name: Tabbar
  #     role: page tab

- id: suite_主菜单_025_s1
  name: 打开文件
  description: ''
  steps:
  - step_type: action
    action: dtk_main_menu
    selector:
      name: OptionMenu
      role: menu
    items:
    - 打开文件
    wait: 1.0
  - step_type: action
    action: file_dialog_select
    path: ${TEST_FILES_DIR}/
    name: menu_save.txt
    wait: 3.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: TextEditor
      role: text

- id: suite_主菜单_026_s1
  name: 保存
  description: ''
  steps:
  - step_type: action
    action: keyboard_type_text
    text: save content test
  - step_type: action
    action: dtk_main_menu
    selector:
      name: OptionMenu
      role: menu
    items:
    - 保存
    wait: 1.0
  - step_type: action
    action: file_dialog_select
    path: ${TEST_FILES_DIR}/
    name: menu_save.txt
    wait: 3.0
  ##文件保持覆盖框
  - step_type: action
    action: keyboard_press
    key: return
  - step_type: action
    action: keyboard_press
    key: Escape
  assert_steps:
  - step_type: assert
    action: assert_file_exists
    path: ${TEST_FILES_DIR}/menu_save.txt
  - step_type: assert
    action: assert_element
    selector:
      name: TextEditor
      role: text

- id: suite_主菜单_033_s1
  name: 替换
  description: ''
  steps:
  - step_type: action
    action: keyboard_type
    text: 'replace target

      replace target

      other'
  - step_type: action
    action: keyboard_hot_key
    key: Ctrl+H
  - step_type: action
    action: keyboard_type
    text: replace
    wait: 2.0
  - step_type: action
    action: element_set_value
    selector:
      name: ReplaceWithInput
    text: sub
  - step_type: action
    action: element_action
    selector:
      name: ReplaceNext
      role: push button
    do: click
  - step_type: action
    action: element_action
    selector:
      name: ReplaceSkip
      role: push button
    do: click
  - step_type: action
    action: element_action
    selector:
      name: ReplaceRest
      role: push button
    do: click
  - step_type: action
    action: element_action
    selector:
      name: ReplaceAll
      role: push button
    do: click
  - step_type: action
    action: element_action
    selector:
      name: CloseReplace
    do: click
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: TextEditor
      role: text

- id: suite_主菜单_034_s1
  name: 查找_不按压enter键
  description: ''
  steps:
  - step_type: action
    action: keyboard_hot_key
    key: Ctrl+T
  - step_type: action
    action: keyboard_type
    text: 'find target

      find target'
  - step_type: action
    action: keyboard_hot_key
    key: Ctrl+F
  - step_type: action
    action: keyboard_type
    text: find
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: FindNext
      role: push button
    do: click
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: FindInput
  - step_type: assert
    action: assert_element
    selector:
      name: TextEditor
      role: text

- id: suite_主菜单_035_s1
  name: 查找_更换查找词
  description: ''
  steps:
  - step_type: action
    action: keyboard_hot_key
    key: Ctrl+T
  - step_type: action
    action: keyboard_type
    text: 'alpha beta

      alpha gamma

      beta gamma'
  - step_type: action
    action: keyboard_hot_key
    key: Ctrl+F
  - step_type: action
    action: keyboard_type
    text: alpha
    wait: 2.0
  - step_type: action
    action: keyboard_hot_key
    key: Ctrl+A
  - step_type: action
    action: keyboard_type
    text: beta
    wait: 2.0
  - step_type: action
    action: element_action
    selector:
      name: FindNext
      role: push button
    do: click
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: FindInput
  - step_type: assert
    action: assert_element
    selector:
      name: FindInput
  - step_type: assert
    action: assert_element
    selector:
      name: TextEditor
      role: text

#最后测新窗口避免影响其它case
- id: suite_主菜单_036_s1
  name: 新建窗口
  description: ''
  steps:
  - step_type: action
    action: dtk_main_menu
    selector:
      name: OptionMenu
      role: menu
    items:
    - 新窗口
    wait: 1.0
  - step_type: action
    action: keyboard_type
    text: new window input
  assert_steps:
  - step_type: assert
    action: assert_window_count
    expected: 2
  - step_type: assert
    action: assert_element
    selector:
      name: EditorStack
      role: layered pane
  - step_type: assert
    action: assert_element
    selector:
      name: TextEditor
      role: text

- id: suite_主菜单_037_s1
  name: 退出窗口
  description: ''
  steps:
  #退出上一个新窗口，保证一个在前台
  - step_type: action
    action: dtk_main_menu
    selector:
      name: OptionMenu
      role: menu
    items:
    - 退出
    wait: 1.0
  - step_type: action
    action: keyboard_press
    key: return
    wait: 1.0
  - step_type: action
    action: keyboard_press
    key: escape

- id: suite_主菜单_B01_001_s1
  name: 帮助_打开帮助文档
  description: '覆盖原始用例：1592869（P1）'
  steps:
  - step_type: action
    action: dtk_main_menu
    selector:
      name: OptionMenu
      role: menu
    items:
    - 帮助
    wait: 3.0
  assert_steps:
  - step_type: assert
    action: assert_window
    selector:
      name_pattern: "帮助手册.*"

- id: suite_主菜单_B01_002_s1
  name: 切换主题_应用主题
  description: '覆盖原始用例：1592871（P2）；status: unsupported — switchThemeAction 菜单项在源码中被注释禁用（window.cpp:575），待启用后可自动化执行'
  status: unsupported
  reason: switchThemeAction 的 m_menu->addAction 被注释禁用（window.cpp:575），切换主题菜单项当前不可用
  steps:
  - step_type: action
    action: dtk_main_menu
    selector:
      name: OptionMenu
      role: menu
    items:
    - 主题
    - 深色
    wait: 1.0
  - step_type: action
    action: dtk_main_menu
    selector:
      name: OptionMenu
      role: menu
    items:
    - 主题
    - 浅色
    wait: 1.0
  - step_type: action
    action: dtk_main_menu
    selector:
      name: OptionMenu
      role: menu
    items:
    - 主题
    - 跟随系统
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: TextEditor
      role: text

- id: suite_主菜单_B01_003_s1
  name: 打印_调用打印对话框
  description: '覆盖原始用例：1592873（P2）'
  steps:
  - step_type: action
    action: keyboard_type_text
    text: print test content
  - step_type: action
    action: dtk_main_menu
    selector:
      name: OptionMenu
      role: menu
    items:
    - 打印
    wait: 5.0
  - step_type: action
    action: keyboard_press
    key: escape
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: TextEditor
      role: text

- id: suite_主菜单_B01_004_s1
  name: 另存为_选择路径保存
  description: '覆盖原始用例：1592875（P2）'
  steps:
  - step_type: action
    action: keyboard_type_text
    text: save as test content
  - step_type: action
    action: dtk_main_menu
    selector:
      name: OptionMenu
      role: menu
    items:
    - 另存为
    wait: 1.0
  - step_type: action
    action: file_dialog_select
    path: ${TEST_FILES_DIR}/
    name: b01_saveas.txt
    wait: 3.0
  - step_type: action
    action: keyboard_press
    key: return
    wait: 1.0
  - step_type: action
    action: keyboard_press
    key: escape
  assert_steps:
  - step_type: assert
    action: assert_file_exists
    path: ${TEST_FILES_DIR}/b01_saveas.txt
  - step_type: assert
    action: assert_element
    selector:
      name: TextEditor
      role: text

teardown:
- action: session_stop
