name: 路径与保存设置_suite
app: deepin-editor
module: 路径与保存设置
vars:
  TEST_FILES_DIR: ${PROJECT_ROOT}/tests/at/files/

setup:
- action: session_start
  command: |
    echo "clear tmp files in testfiles_dir: ${TEST_FILES_DIR}"
    bash -lc 'rm -r ~/.local/share/deepin/deepin-editor/blank-files/; sleep 1.0;'
    bash -lc 'rm -rf ${TEST_FILES_DIR}/未命名文档*; sleep 1.0;'
    deepin-editor
  wait: 3.0
suites:
- id: suite_路径与保存设置_B02_001_s1
  name: 自定义操作路径_打开新文件
  description: '覆盖原始用例：1593509（P1，冒烟）'
  steps:
  - step_type: action
    action: dtk_main_menu
    selector:
      name: OptionMenu
      role: menu
    items:
    - 设置
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: 打开/保存设置
      role: list item
    do: click
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: CustomizeDefaultPath
      role: check box
    do: click
  - step_type: action
    action: element_action
    selector:
      name: BrowseCustomPath
      role: button
    do: click
  - step_type: action
    action: file_dialog_select
    path: ~/Documents/custom
  # 关闭设置回到编辑
  - step_type: action
    action: keyboard_press
    key: escape
    wait: 1.0
  - step_type: action
    action: dtk_main_menu
    selector:
      name: OptionMenu
      role: menu
    items:
    - 打开文件
    wait: 1.0
  - step_type: action
    action: file_dialog_cancel
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: TextEditor
      role: text

- id: suite_路径与保存设置_B02_002_s1
  name: 与当前文件保存一致_首次保存新文件
  description: '覆盖原始用例：1593533（P1，冒烟）'
  steps:
  - step_type: action
    action: dtk_main_menu
    selector:
      name: OptionMenu
      role: menu
    items:
    - 设置
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: 打开/保存设置
      role: list item
    do: click
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: SamePathAsCurrentFile
      role: check box
    do: click
  - step_type: action
    action: keyboard_press
    key: escape
    wait: 1.0
  - step_type: action
    action: keyboard_type_text
    text: same path save test
  - step_type: action
    action: keyboard_hot_key
    key: Ctrl+S
    wait: 1.0
  - step_type: action
    action: file_dialog_cancel
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: TextEditor
      role: text

