- id: suite_路径与保存设置_B02_006_s1
  name: 取消勾选允许鼠标中键粘贴
  description: '覆盖原始用例：1593561（P1）'
  status: unsupported
  reason: >-
    设置对话框中"允许鼠标中键粘贴"复选框为 DSettings 通用控件
    (dsettingswidgetfactory.cpp)，accessibleName="OptionCheckbox" 且
    objectName="OptionCheckbox"，无法通过 AT-SPI 唯一定位，需开发补名后可自动化执行
  steps:
  - step_type: action
    action: dtk_main_menu
    selector:
      name: OptionMenu
      role: menu
    items:
    - 设置
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: 高级设置
      role: list item
    do: click
    wait: 1.0
    #TODO： DSetting 的objectname设置
  # - step_type: action
  #   action: element_action
  #   selector:
  #     accessible_id: allow_midbutton_paste
  #     role: check box
  #   do: click
  - step_type: action
    action: keyboard_press
    key: escape
    wait: 1.0
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: TextEditor
      role: text

teardown:
- action: session_stop
