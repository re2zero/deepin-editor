- id: suite_主菜单_007_s1
  name: 自定义操作路径_保存一个未保存过的新文档
  module: 主菜单
  steps:
  - step_type: action
    action: dtk_main_menu
    selector:
      name: OptionMenu
      role: menu
    items:
    - 设置
    wait: 1.0
  - step_type: action
    action: element_action
    selector:
      name: CustomizeDefaultPath
      role: check box
    do: click
  - step_type: action
    action: element_set_value
    selector:
      name: CustomPathInput
      role: text
    text: /home/zero/Documents/custom
  - step_type: action
