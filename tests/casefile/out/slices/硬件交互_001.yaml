- id: '1592573'
  raw_title: 主菜单，子菜单中的键盘交互
  raw_precondition: ''
  raw_steps: '1. 光标在标题栏时，使用键盘上的Tab键切换至主菜单图标，按下“回车键”

    2. 在主菜单列表，使用“↑”、“↓”、“←”、“→”方向键

    3. 在高亮的列表中使用“回车键”

    4. 按“ESC键”'
  raw_expected: '1. 展示主菜单列表

    2. 使用“↑”、“↓”方向键在条目中选择，“←”、“→”方向键进行“收起”、“展开”子菜单动作

    3. 执行选中的按钮

    4. 退出菜单'
  title: 主菜单，子菜单中的键盘交互
  module: 硬件交互
  priority: '1'
  precondition: []
  steps:
  - 光标在标题栏时，使用键盘上的Tab键切换至主菜单图标，按下“回车键”
  - 在主菜单列表，使用“↑”、“↓”、“←”、“→”方向键
  - 在高亮的列表中使用“回车键”
  - 按“ESC键”
  expected:
  - 展示主菜单列表
  - 使用“↑”、“↓”方向键在条目中选择，“←”、“→”方向键进行“收起”、“展开”子菜单动作
  - 执行选中的按钮
  - 退出菜单
  case_type: 功能测试
  manual: false

