- id: '1592615'
  raw_title: 二指滚动
  raw_precondition: ''
  raw_steps: '1. 在文档视图界面，“自然滚动”选项关闭，二指向上移动

    2. “自然滚动”选项打开，二指向上移动

    3. “自然滚动”选项关闭，二指向下移动

    4. “自然滚动”选项打开，二指向下移动'
  raw_expected: '1. “自然滚动”选项关闭，二指向上移动对应的操作是“屏幕向上滚动”

    2. “自然滚动”选项打开，二指向上移动对应的事件就是“屏幕向下滚动”

    3. “自然滚动”选项关闭，二指向下移动对应的操作是“屏幕向下滚动”

    4. “自然滚动”选项打开，二指向下移动对应的事件就是“屏幕向上滚动”'
  title: 二指滚动
  module: 硬件交互
  priority: '1'
  precondition: []
  steps:
  - 在文档视图界面，“自然滚动”选项关闭，二指向上移动
  - “自然滚动”选项打开，二指向上移动
  - “自然滚动”选项关闭，二指向下移动
  - “自然滚动”选项打开，二指向下移动
  expected:
  - “自然滚动”选项关闭，二指向上移动对应的操作是“屏幕向上滚动”
  - “自然滚动”选项打开，二指向上移动对应的事件就是“屏幕向下滚动”
  - “自然滚动”选项关闭，二指向下移动对应的操作是“屏幕向下滚动”
  - “自然滚动”选项打开，二指向下移动对应的事件就是“屏幕向上滚动”
  case_type: 功能测试
  manual: false

