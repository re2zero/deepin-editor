- id: '1592557'
  raw_title: 高分屏_拖拽标签页
  raw_precondition: 连接高分屏 ，切换缩放比 &gt; 1.25
  raw_steps: '1. 打开文本编辑器，默认新开一个空白标签页（窗口1）

    2. 再开新窗口（窗口2），打开文档A进行编辑 ，打开文档B

    3. 将窗口1中的唯一的一个标签页拖拽合并到窗口2中

    4. 再将窗口2中的任意标签页拖拽出来，生成新窗口'
  raw_expected: "1. \n2. \n3. 每个缩放比下，拖拽过程中表现正常，合并成功\n4. 每个缩放比下，拖拽过程中表现正常，拆分成功"
  title: 高分屏_拖拽标签页
  module: 硬件交互
  priority: '3'
  precondition:
  - 连接高分屏 ，切换缩放比 &gt; 1.25
  steps:
  - 打开文本编辑器，默认新开一个空白标签页（窗口1）
  - 再开新窗口（窗口2），打开文档A进行编辑 ，打开文档B
  - 将窗口1中的唯一的一个标签页拖拽合并到窗口2中
  - 再将窗口2中的任意标签页拖拽出来，生成新窗口
  expected:
  - ''
  - ''
  - 每个缩放比下，拖拽过程中表现正常，合并成功
  - 每个缩放比下，拖拽过程中表现正常，拆分成功
  case_type: 兼容性测试
  manual: false
