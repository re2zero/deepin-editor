- id: '1593649'
  raw_title: 不保留现场_关闭应用（子标签页已保存+未保存）
  raw_precondition: '1.文本编辑器高级设置中取消勾选“保留关闭前的窗口”

    2.仅存在一个文本编辑器窗口'
  raw_steps: '1. 文本编辑器单窗口中标签页均含有已保存又含有未保存

    2. 关闭应用（点击X/主菜单“退出”/Alt+F4）

    3. 点击【不保存】

    4. 点击【保存】

    5. 再次打开文本编辑器'
  raw_expected: '1. 所有标签页标题栏中均包含* （例如，文本a ;*文本b;*文本c）

    2. 从左往右开始检测各标签页是否需要保存：最左边的标签页文本a为已存在文件，且无改动，直接关闭。 焦点顺移至*文本b标签页，并弹出提示框“您是否要保存此文件？”
    取消/不保存/保存

    3. 不保存当前的*文本b标签页中的修改内容，关闭该标签页。焦点顺移至*文本c标签页，并弹出提示框“您是否要保存此文件？” 取消/不保存/保存

    4. 需弹出保存窗口，引导用户输入文件名、编码方式进行保存。保存完毕后，关闭窗口。

    5. 新开一个空白文档tab标签页'
  title: 不保留现场_关闭应用（子标签页已保存+未保存）
  module: 主菜单
  priority: '1'
  precondition:
  - 文本编辑器高级设置中取消勾选“保留关闭前的窗口”
  - 仅存在一个文本编辑器窗口
  steps:
  - 文本编辑器单窗口中标签页均含有已保存又含有未保存
  - 关闭应用（点击X/主菜单“退出”/Alt+F4）
  - 点击【不保存】
  - 点击【保存】
  - 再次打开文本编辑器
  expected:
  - 所有标签页标题栏中均包含* （例如，文本a ;*文本b;*文本c）
  - 从左往右开始检测各标签页是否需要保存：最左边的标签页文本a为已存在文件，且无改动，直接关闭。 焦点顺移至*文本b标签页，并弹出提示框“您是否要保存此文件？”
    取消/不保存/保存
  - 不保存当前的*文本b标签页中的修改内容，关闭该标签页。焦点顺移至*文本c标签页，并弹出提示框“您是否要保存此文件？” 取消/不保存/保存
  - 需弹出保存窗口，引导用户输入文件名、编码方式进行保存。保存完毕后，关闭窗口。
  - 新开一个空白文档tab标签页
  case_type: 功能测试
  manual: false

- id: '1593647'
  raw_title: 不保留现场_多窗口关闭应用
  raw_precondition: '1.文本编辑器高级设置中取消勾选“保留关闭前的窗口”

    2.至少存在2个文本编辑器窗口'
  raw_steps: '1. 窗口1中存在空白的新建标签页； 新建标签页中有内容但未进行保存的标签页； 已打开文档的标签页；  已打开文档中进行修改内容未保存（*标题）的标签页，
    对窗口1进行关闭（点击X/主菜单“退出”/Alt+F4）

    2. 窗口2中存在空白的新建标签页； 新建标签页中有内容但未进行保存的标签页； 已打开文档的标签页；  已打开文档中进行修改内容未保存（*标题）的标签页，（点击X/主菜单“退出”/Alt+F4）
    关闭窗口

    3. 再次打开文本编辑器'
  raw_expected: '1. 从左往右开始对每个标签页操作， 对于无*标签的直接关闭，对于未保存含有*标签页触发提示是否保存文档，可成功完成关闭窗口1中所有标签页。
    窗口2未受影响。

    2. 同上，窗口2可成功被完成关闭。

    3. 新开一个空白文档tab标签页'
  title: 不保留现场_多窗口关闭应用
  module: 主菜单
  priority: '2'
  precondition:
  - 文本编辑器高级设置中取消勾选“保留关闭前的窗口”
  - 至少存在2个文本编辑器窗口
  steps:
  - 窗口1中存在空白的新建标签页； 新建标签页中有内容但未进行保存的标签页； 已打开文档的标签页；  已打开文档中进行修改内容未保存（*标题）的标签页， 对窗口1进行关闭（点击X/主菜单“退出”/Alt+F4）
  - 窗口2中存在空白的新建标签页； 新建标签页中有内容但未进行保存的标签页； 已打开文档的标签页；  已打开文档中进行修改内容未保存（*标题）的标签页，（点击X/主菜单“退出”/Alt+F4）
    关闭窗口
  - 再次打开文本编辑器
  expected:
  - 从左往右开始对每个标签页操作， 对于无*标签的直接关闭，对于未保存含有*标签页触发提示是否保存文档，可成功完成关闭窗口1中所有标签页。 窗口2未受影响。
  - 同上，窗口2可成功被完成关闭。
  - 新开一个空白文档tab标签页
  case_type: 功能测试
  manual: false

