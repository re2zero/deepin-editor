- id: '1919211'
  raw_title: 查找替换-多匹配项中特定选中状态保留
  raw_precondition: 1.文本编辑器正文存在多个文本“武汉”
  raw_steps: '1. 打开文本编辑器，快捷键Ctrl+F触发查找功能

    2. 在查找输入框输入文本“武汉”，点击下一个，再次点击下一个

    3. 在查找弹窗中，点击右上角的“替换”按钮

    4. 观察文本编辑区域的高亮选中状态'
  raw_expected: '1. 下方显示查找窗口

    2. 第二个“武汉”文本被高亮选中

    3. 替换弹窗的''替换为''输入框自动填充内容与原文本区域高亮选中文本一致

    4. 原文本区域中第二个''武汉''文本保持高亮选中状态'
  title: 查找替换-多匹配项中特定选中状态保留
  module: 文本编辑器
  priority: '2'
  precondition:
  - 文本编辑器正文存在多个文本“武汉”
  steps:
  - 打开文本编辑器，快捷键Ctrl+F触发查找功能
  - 在查找输入框输入文本“武汉”，点击下一个，再次点击下一个
  - 在查找弹窗中，点击右上角的“替换”按钮
  - 观察文本编辑区域的高亮选中状态
  expected:
  - 下方显示查找窗口
  - 第二个“武汉”文本被高亮选中
  - 替换弹窗的'替换为'输入框自动填充内容与原文本区域高亮选中文本一致
  - 原文本区域中第二个'武汉'文本保持高亮选中状态
  case_type: 功能测试
  manual: false

