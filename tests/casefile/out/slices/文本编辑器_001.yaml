- id: '1875739'
  raw_title: 替换（右键菜单）
  raw_precondition: ''
  raw_steps: '1. 在新打开一个窗口中，空文档中点击右键，查看右键菜单显示

    2. 在文档页面选中一段文本，右键菜单中选中替换

    3. 点击 替换

    4. 点击剩余替换

    5. 点击全部替换

    6. 点击跳过

    7. 按下ESC，或 关闭按钮

    8. 拖拉替换框（新需求）'
  raw_expected: '1. 右键菜单中没有替换菜单

    2. 替换框出现，默认查找当前选择文本；

    3. 逐个替换

    4. 一次性替换剩余匹配文本

    5. 一次性替换所有匹配文本

    6. 不替换当前匹配文本

    7. 关闭替换框

    8. 不可移动'
  title: 替换（右键菜单）
  module: 文本编辑器
  priority: '2'
  precondition: []
  steps:
  - 在新打开一个窗口中，空文档中点击右键，查看右键菜单显示
  - 在文档页面选中一段文本，右键菜单中选中替换
  - 点击 替换
  - 点击剩余替换
  - 点击全部替换
  - 点击跳过
  - 按下ESC，或 关闭按钮
  - 拖拉替换框（新需求）
  expected:
  - 右键菜单中没有替换菜单
  - 替换框出现，默认查找当前选择文本；
  - 逐个替换
  - 一次性替换剩余匹配文本
  - 一次性替换所有匹配文本
  - 不替换当前匹配文本
  - 关闭替换框
  - 不可移动
  case_type: 功能测试
  manual: false

