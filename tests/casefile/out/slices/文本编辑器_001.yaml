- id: '1919207'
  raw_title: 查找替换-替换按钮切换后与Ctrl+H触发功能一致性验证
  raw_precondition: 1.文本编辑器已打开，新建空白文档（或打开任意包含普通文本内容的文档）
  raw_steps: '1. 使用快捷键Ctrl+F触发查找功能，点击''替换''按钮切换至替换弹窗

    2. 关闭当前替换弹窗，使用快捷键Ctrl+H直接触发替换功能

    3. 对比步骤1与步骤2的弹窗标题、输入框位置、按钮排列顺序及功能按钮文本'
  raw_expected: '1. 成功切换至替换弹窗

    2. 弹出替换弹窗

    3. 步骤1与步骤2的弹窗标题、输入框位置、按钮排列顺序及功能按钮文本完全一致'
  title: 查找替换-替换按钮切换后与Ctrl+H触发功能一致性验证
  module: 文本编辑器
  priority: '2'
  precondition:
  - 文本编辑器已打开，新建空白文档（或打开任意包含普通文本内容的文档）
  steps:
  - 使用快捷键Ctrl+F触发查找功能，点击'替换'按钮切换至替换弹窗
  - 关闭当前替换弹窗，使用快捷键Ctrl+H直接触发替换功能
  - 对比步骤1与步骤2的弹窗标题、输入框位置、按钮排列顺序及功能按钮文本
  expected:
  - 成功切换至替换弹窗
  - 弹出替换弹窗
  - 步骤1与步骤2的弹窗标题、输入框位置、按钮排列顺序及功能按钮文本完全一致
  case_type: 功能测试
  manual: false

