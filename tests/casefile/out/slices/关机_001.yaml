  raw_steps: '1. 打开软件后，点击右上角的最小化，查看软件显示

    2. 软件最小化后，从桌面上双击新文件 或新文件右键菜单通过文本编辑器打开

    3. 软件最小化后，从桌面上双击已打开文件 或 文件右键菜单通过文本编辑器打开'
  raw_expected: '1. 当前窗口会自动最小化

    2. 软件会自动还原窗口并展示新文件窗口

    3. 软件会自动还原窗口'
