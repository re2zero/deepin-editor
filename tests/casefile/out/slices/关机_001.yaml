- id: '1593181'
  raw_title: 软件安装
  raw_precondition: ''
  raw_steps: '1. 手动下载软件包成功后，通过终端dpkg -i deepin-editor 进行软件安装

    2. 安装成功后查看软件是否显示正常，软件图标是否显示正常

    3. 软件安装成功后，再次用终端进行安装，查看软件是否依然能够安装成功'
  raw_expected: '1. 可以安装成功

    2. 软件显示正常，图标显示正常

    3. 软件再次进行安装，依然可以安装成功'
  title: 软件安装
  module: 关机
  priority: '1'
  precondition: []
  steps:
  - 手动下载软件包成功后，通过终端dpkg -i deepin-editor 进行软件安装
  - 安装成功后查看软件是否显示正常，软件图标是否显示正常
  - 软件安装成功后，再次用终端进行安装，查看软件是否依然能够安装成功
  expected:
  - 可以安装成功
  - 软件显示正常，图标显示正常
  - 软件再次进行安装，依然可以安装成功
  case_type: 功能测试
  manual: false

- id: '1593179'
  raw_title: 软件启动
  raw_precondition: ''
  raw_steps: '1. 软件安装成功后，在启动器中查看是否有软件图标

    2. 在启动器中双击编辑器图标，查看软件显示

    3. 启动器中右键打开编辑器

    4. 在启动器中输入“编辑器”进行搜索该软件，查看是否可以搜索成功

    5. 启动器右键发送到dock，查看软件显示

    6. 软件图标发送到dock成功后，用鼠标点击dock上的图标，查看软件显示

    7. 启动器右键发送到桌面，点击桌面图标打开编辑器

    8. 通过终端命令打开编辑器　deepin-editor

    9. 在启动器中设置设置该软件为开启启动，重启PC机，查看软件显示'
  raw_expected: '1. 在启动器中有安装图标

    2. 软件会自动启动，弹出对话框显示该软件的主界面

    3. 正常打开

    4. 可以正常搜索到该软件

    5. 软件图标可以正常发送到dock

    6. 软件会自动启动，弹出对话框显示该软件的主界面

    7. 正常打开，没有报错

    8. 正常打开，没有报错

    9. 软件会随着系统启动而启动'
  title: 软件启动
  module: 关机
  priority: '1'
  precondition: []
  steps:
  - 软件安装成功后，在启动器中查看是否有软件图标
  - 在启动器中双击编辑器图标，查看软件显示
  - 启动器中右键打开编辑器
  - 在启动器中输入“编辑器”进行搜索该软件，查看是否可以搜索成功
  - 启动器右键发送到dock，查看软件显示
  - 软件图标发送到dock成功后，用鼠标点击dock上的图标，查看软件显示
  - 启动器右键发送到桌面，点击桌面图标打开编辑器
  - 通过终端命令打开编辑器　deepin-editor
  - 在启动器中设置设置该软件为开启启动，重启PC机，查看软件显示
  expected:
  - 在启动器中有安装图标
  - 软件会自动启动，弹出对话框显示该软件的主界面
  - 正常打开
  - 可以正常搜索到该软件
  - 软件图标可以正常发送到dock
  - 软件会自动启动，弹出对话框显示该软件的主界面
  - 正常打开，没有报错
  - 正常打开，没有报错
  - 软件会随着系统启动而启动
  case_type: 功能测试
  manual: false

- id: '1593175'
  raw_title: dock右键菜单
  raw_precondition: ''
  raw_steps: '1. 在启动器中将软件图标发送到dock上，在dock上右键软件图标查看系统显示

    2. 软件弹出右键菜单后，选中打开按钮，查看软件显示

    3. 软件弹出右键菜单后，选中移除驻留按，查看软件显示

    4. 在dock上显示软件窗口后，点击鼠标右键，查看系统显示

    5. 在系统弹出窗口后，点击关闭所有窗口，查看软件显示

    6. 在系统弹出窗口后，点击所有窗口，查看软件显示

    7. 在系统弹出窗口后，点击驻留按钮，查看系统显示'
  raw_expected: '1. 系统会自动弹出右键菜单显示：打开、移除驻留

    2. 软件会自动运行

    3. 软件会自动在dock上移除图标

    4. 系统会自动弹出右键菜单，显示：编辑器、强制退出、所有窗口、移除驻留、关闭所有

    5. 系统会自动关闭当前所有打开的深度编辑器窗口

    6. 软件会列出当前所有已经打开的窗口

    7. 系统会自动将当前软件图标驻留在dock上'
  title: dock右键菜单
  module: 关机
  priority: '2'
  precondition: []
  steps:
  - 在启动器中将软件图标发送到dock上，在dock上右键软件图标查看系统显示
  - 软件弹出右键菜单后，选中打开按钮，查看软件显示
  - 软件弹出右键菜单后，选中移除驻留按，查看软件显示
  - 在dock上显示软件窗口后，点击鼠标右键，查看系统显示
  - 在系统弹出窗口后，点击关闭所有窗口，查看软件显示
  - 在系统弹出窗口后，点击所有窗口，查看软件显示
  - 在系统弹出窗口后，点击驻留按钮，查看系统显示
  expected:
  - 系统会自动弹出右键菜单显示：打开、移除驻留
  - 软件会自动运行
  - 软件会自动在dock上移除图标
  - 系统会自动弹出右键菜单，显示：编辑器、强制退出、所有窗口、移除驻留、关闭所有
  - 系统会自动关闭当前所有打开的深度编辑器窗口
  - 软件会列出当前所有已经打开的窗口
  - 系统会自动将当前软件图标驻留在dock上
  case_type: 功能测试
  manual: false

