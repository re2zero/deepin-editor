- id: '1919203'
  raw_title: 查找替换-点击替换按钮切换至替换弹窗（未选中文本）
  raw_precondition: 1.文本编辑器已打开，新建空白文档（或打开任意包含普通文本内容的文档），当前文本区域未选中文本
