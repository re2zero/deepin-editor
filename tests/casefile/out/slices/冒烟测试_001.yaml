    2. 替换弹窗正常显示

    3. 弹窗标题显示为''替换''，输入框位置、替换、跳过、剩余替换、全部替换按钮与使用快捷键Ctrl+H触发的替换弹窗完全一致'
  title: 查找替换-点击替换按钮切换至替换弹窗（未选中文本）
  module: 冒烟测试
  priority: '1'
  precondition:
  - 文本编辑器已打开，新建空白文档（或打开任意包含普通文本内容的文档），当前文本区域未选中文本
  steps:
  - 使用快捷键Ctrl+F触发查找功能
  - 点击查找弹窗中的'替换'按钮
  - 观察当前弹窗标题及布局
  expected:
  - 查找弹窗正常显示
  - 替换弹窗正常显示
  - 弹窗标题显示为'替换'，输入框位置、替换、跳过、剩余替换、全部替换按钮与使用快捷键Ctrl+H触发的替换弹窗完全一致
  case_type: 功能测试
  manual: false

