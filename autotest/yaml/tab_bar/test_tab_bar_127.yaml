name: "有左右标签时查看“更多关闭方式”"
app: "deepin-editor"
screenshot: false
description: |
  前置条件:
  有左右标签时；
  存在修改和未修改的文档
  
  测试步骤:
  1. 打开编辑器，新建/打开至少3个标签页
  2. 点击有左右标签的标签页，查看右键菜单中的“更多关闭方式”
  3. 点击“关闭左侧所有标签页”
  4. 点击“关闭右侧所有标签页”
  5. 点击“关闭所有未修改标签页”
  
  预期结果:
  1. 
  2. 文案“关闭左侧所有标签页”
  2-2.文案“关闭右侧所有标签页”
  2-3.文案“关闭所有未修改标签页”
  3. 关闭当前标签页左侧的所有文件
  4. 关闭当前标签页右侧的所有文件
  5. 关闭所有未修改的文件
module: "/V25_2500（测试部专用）/B类解耦商店应用/文本编辑器/工作区"
feature: "标签栏"
tags:
  - L2
vars:
  xlsx_id: "127"
  case_type: "功能测试"

setup:
  - action: session_start
    command: "${APP_PATH}"
    wait: 1.0

teardown:
  - action: session_stop

steps:
  - name: "点击新建标签"
    action: element_action
    ref: add_tab_button
    do: "click"
    wait: 0.3
  - name: "点击新建标签"
    action: element_action
    ref: add_tab_button
    do: "click"
    wait: 0.3
  - name: "右键标签更多关闭方式"
    action: context_menu_comb
    ref: ctx_close_left_tabs
    wait: 0.5
  - name: "等待验证"
    action: wait
    wait: 0.3
    assert:
      - type: element_visible
        selector:
          name: "更多关闭方式"
