name: "大文件复制粘帖"
app: "deepin-editor"
screenshot: false
description: |
  测试步骤:
  1. 通过文本编辑器打开一个大文件（如，100M.txt）
  2. 对内容进行全选->复制->粘帖（多次）
  3. 对内容进行全选后，复制->粘贴（多次）
  
  预期结果:
  1. 完全加载
  2. 2-1： 粘帖正常 ；
  2-2： （受限于不同的硬件配置）当系统可用内存无法完成复制时，toast提示语： “！内存不足，复制失败”，不会造成文本编辑器或者系统的运行异常
  3. 无卡死，闪退等异常现象
module: "/V25_2500（测试部专用）/B类解耦商店应用/文本编辑器/工作区"
feature: "编辑操作"
tags:
  - L2
vars:
  xlsx_id: "111"
  case_type: "功能测试"

setup:
  - action: session_start
    command: "${APP_PATH}"
    wait: 1.0

teardown:
  - action: session_stop

steps:
  - name: "输入大段文本"
    action: keyboard_type
    text: "大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试大型文本内容测试"
