name: "切换注释&撤销的交互"
app: "deepin-editor"
screenshot: false
description: |
  测试步骤:
  1. 使用文本编辑器打开一个代码文档
  2. 在一行代码前“添加注释”
  3. 执行“取消注释”
  4. 执行“撤销”
  5. 再次“撤销”
  6. 选择一段内容进行“添加注释”
  7. 执行“撤销”
  
  预期结果:
  1. 
  2. 添加注释成功
  3. 已添加的注释取消成功
  4. 撤销step3,即恢复到添加注释的情景
  5. 撤销step2,即恢复到无注释添加的情景
  6. 块注释成功
  7. 撤销step6,即恢复到无注释的情景
module: "/V25_2500（测试部专用）/B类解耦商店应用/文本编辑器/工作区"
feature: "编辑操作"
tags:
  - L2
vars:
  xlsx_id: "135"
  case_type: "功能测试"

setup:
  - action: session_start
    command: "${APP_PATH}"
    wait: 1.0

teardown:
  - action: session_stop

steps:
  - name: "输入代码"
    action: keyboard_type
    text: "line1\nline2\nline3"
    wait: 0.3
  - name: "Ctrl+A全选"
    action: keyboard_hot_key
    keys: "ctrl,a"
    wait: 0.3
  - name: "右键添加注释"
    action: context_menu_comb
    ref: ctx_add_comment
    wait: 0.3
  - name: "Ctrl+Z撤销注释"
    action: keyboard_hot_key
    keys: "ctrl,z"
    wait: 0.3
  - name: "等待验证"
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: "deepin-editor"
