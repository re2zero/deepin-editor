name: "重做"
app: "deepin-editor"
screenshot: false
description: |
  测试步骤:
  1. 在新打开一个窗口中，点击右键，查看右键菜单显示
  2. 在新窗口中输入任意字符，点击右键，查看右键菜单显示
  3. 打开一个有字符的文档，点击右键，查看右键菜单
  4. 打开一个有字符的文档，在文档中新增字符然后撤销，点击右键，查看右键菜单
  5. 打开一个有字符的文档新增字符后撤销，点击右键菜单--重做按钮，查看右键菜单
  
  预期结果:
  1. 右键菜单中没有重做按钮
  2. 右键菜单没有重做按钮
  3. 文档不进行任何操作是没有撤销按钮显示的，只有先进行撤销操作后，才会出现重做
  4. 右键菜单会显示出重做按钮
  5. 软件会自动还原撤销操作，返回到最新操作
module: "/V25_2500（测试部专用）/B类解耦商店应用/文本编辑器/工作区"
feature: "编辑操作"
tags:
  - L2
vars:
  xlsx_id: "122"
  case_type: "功能测试"

setup:
  - action: session_start
    command: "${APP_PATH}"
    wait: 1.0

teardown:
  - action: session_stop

steps:
  - name: "输入文本"
    action: keyboard_type
    text: "重做测试"
    wait: 0.3
  - name: "Ctrl+Z撤销"
    action: keyboard_hot_key
    keys: "ctrl,z"
    wait: 0.3
  - name: "Ctrl+Y重做"
    action: keyboard_hot_key
    keys: "ctrl,y"
    wait: 0.3
  - name: "等待验证"
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: "deepin-editor"
