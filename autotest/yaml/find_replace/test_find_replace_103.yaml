name: "查找_更换查找词"
app: "deepin-editor"
screenshot: false
description: |
  前置条件:
  step5适用1040阶段
  
  测试步骤:
  1. 编辑器打开TXT文档，主菜单中打开查找
  2. 输入字符后完成后，用户按“enter” 键后
  3. 查找结果高亮显示，点击“上一个”、“下一个”按钮
  4. 点击查找输入框中的“X”
  5. 输入新的查找词，点击“上一个”、“下一个”按钮
  6. 再次点检查找输入框中的“X”
  7. 输入新的查找词，按压enter键
  8. 点击“上一个”、“下一个”按钮
  
  预期结果:
  1. 打开查找框，页面显示应保持不变
  2. 全文高亮显示匹配字符，跳转到当前光标后第一个匹配处。
  3. 定位至上一个或下一个结果处
  4. 清除当前输入文本时，不清除查找结果，当前页面保持不变
  5. 跳转到当前光标后第一个新的查找词的匹配处（未有高亮匹配显示）
  6. 清除当前输入文本时，不清除查找结果，当前页面保持不变
  7. 全文高亮显示匹配字符，跳转到当前光标后第一个匹配处。
  8. 定位至上一个或下一个结果处
module: "/V25_2500（测试部专用）/B类解耦商店应用/文本编辑器/主菜单"
feature: "查找替换"
tags:
  - L2
vars:
  xlsx_id: "103"
  case_type: "功能测试"

setup:
  - action: session_start
    command: "${APP_PATH}"
    wait: 1.0

teardown:
  - action: session_stop

steps:
  - name: "输入测试文本"
    action: keyboard_type
    text: "测试文本test"
    wait: 0.3
  - name: "Ctrl+F打开查找"
    action: keyboard_hot_key
    keys: "ctrl,f"
    wait: 0.5
  - name: "输入查找词按enter"
    action: element_set_value
    ref: find_input
    text: "测试"
    wait: 0.3
  - name: "按回车确认查找"
    action: keyboard_press
    keys: "Return"
    wait: 0.3
  - name: "点击下一个"
    action: element_action
    ref: find_next_button
    do: "click"
    wait: 0.3
  - name: "清除输入框"
    action: keyboard_press
    keys: "ctrl+a"
    wait: 0.1
  - name: "输入新查找词"
    action: element_set_value
    ref: find_input
    text: "test"
    wait: 0.3
  - name: "按回车"
    action: keyboard_press
    keys: "Return"
    wait: 0.3
  - name: "等待验证"
    action: wait
    wait: 0.3
    assert:
      - type: element_visible
        selector:
          name: "查找"
