name: "打印"
app: "deepin-editor"
screenshot: false
description: |
  前置条件:
  在打印管理器中成功添加打印机
  
  测试步骤:
  1. 打开一个TXT文档，然后点击主菜单--打印按钮，查看软件显示
  2. 弹出打印窗口后，按ESC键
  3. 弹出打印窗口后，点击×按钮，查看软件显示
  4. 新建空白标签页进行编辑（此时文件名前有*），点击主菜单--打印按钮进行打印，查看返回的打印toast消息 或 进入打印管理器中查看“打印队列”里此条记录的文档列
  5. 本地文件进行编辑（此时文件名前有*），点击主菜单--打印按钮进行打印，查看返回的打印toast消息 或 进入打印管理器中查看“打印队列”里此条记录文档列
  
  预期结果:
  1. 软件会自动弹出打印窗口（预览内容显示正常，默认当前打印机）
  2. 打印窗口消失
  3. 打印窗口自动消失
  4. 显示当前打印的文档名（无*）
  5. 显示当前打印的文档名（无*）
module: "/V25_2500（测试部专用）/B类解耦商店应用/文本编辑器/主菜单"
feature: "窗口管理"
tags:
  - L2
vars:
  xlsx_id: "095"
  case_type: "功能测试"

setup:
  - action: session_start
    command: "${APP_PATH}"
    wait: 1.0

teardown:
  - action: session_stop

steps:
  - name: "主菜单打印"
    action: main_menu_comb
    ref: menu_print
    wait: 1.0
  - name: "等待验证"
    action: wait
    wait: 0.3
    assert:
      - type: ocr_exist
        text: "打印"
