name: "最小化后从启动器打开应用"
app: "deepin-editor"
screenshot: false
description: |
  测试步骤:
  1. 打开软件后，点击右上角的最小化，查看软件显示
  2. 软件最小化后，从启动器中点击文本编辑器打开
  
  预期结果:
  1. 当前窗口会自动最小化
  2. 文本编辑器新开一窗口
module: "/V25_2500（测试部专用）/B类解耦商店应用/文本编辑器/冒烟测试"
feature: "窗口管理"
tags:
  - L2
vars:
  xlsx_id: "059"
  case_type: "功能测试"

setup:
  - action: session_start
    command: "${APP_PATH}"
    wait: 1.0

teardown:
  - action: session_stop

steps:
  - name: "最小化窗口"
    action: element_action
    ref: minimize_button
    do: "click"
    wait: 0.5
  - name: "等待验证"
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: "deepin-editor"
