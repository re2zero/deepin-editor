name: "点击行号_最后一行"
app: "deepin-editor"
screenshot: false
description: |
  前置条件:
  文本编辑器设置中默认勾选“显示行号”
  
  测试步骤:
  1. 通过文本编辑器新开一多行文档
  2. 在左侧栏中单击最后一行
  
  预期结果:
  1. 首行行号默认高亮（光标闪烁在首行）
  2. 默认选中整行内容，并且光标定位在当前行尾
module: "/V25_2500（测试部专用）/B类解耦商店应用/文本编辑器/工作区"
feature: "工作区"
tags:
  - L1
vars:
  xlsx_id: "033"
  case_type: "功能测试"

setup:
  - action: session_start
    command: "${APP_PATH}"
    wait: 1.0

teardown:
  - action: session_stop

steps:
  - name: "输入多行文本"
    action: keyboard_type
    text: "l1\nl2\nl3\nl4\nl5"
    wait: 0.3
  - name: "Ctrl+A全选"
    action: keyboard_hot_key
    keys: "ctrl,a"
    wait: 0.3
  - name: "等待验证"
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: "deepin-editor"
