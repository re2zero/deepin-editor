name: "Tip框显示文件路径"
app: "deepin-editor"
screenshot: false
description: |
  测试步骤:
  1. 打开编辑器，点击+新建标签页，鼠标光标移动到标签页上
  2. 点击Ctrl+s，弹出保存确认后，鼠标光标移动到标签页上
  
  预期结果:
  1. 弹出tip框显示，文件名称
  2. 弹出tip框显示，文件路径+文件名称
module: "/V25_2500（测试部专用）/B类解耦商店应用/文本编辑器/冒烟测试"
feature: "工作区"
tags:
  - L1
vars:
  xlsx_id: "048"
  case_type: "功能测试"

setup:
  - action: session_start
    command: "${APP_PATH}"
    wait: 1.0

teardown:
  - action: session_stop

steps:
  - name: "主菜单打开文件"
    action: main_menu_comb
    ref: menu_open_file
    wait: 1.0
  - name: "输入文件路径"
    action: keyboard_type
    text: "${TEST_FILES_DIR}/tip_test.txt"
    wait: 0.3
  - name: "回车打开"
    action: keyboard_press
    keys: "Return"
    wait: 1.0
  - name: "鼠标悬停标签页"
    action: mouse_click
    ref: tab_bar
    wait: 1.0
  - name: "等待验证"
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: "deepin-editor"
