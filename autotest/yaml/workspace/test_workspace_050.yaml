name: "关闭应用自动保存现场_恢复现场后保存临时文件"
app: "deepin-editor"
screenshot: false
description: |
  前置条件:
  只剩下一个文本编辑器应用窗口
  
  测试步骤:
  1. 使用文本编辑器打开一个文档并编辑或新建tab页进行编辑
  2. 点击应用窗口右上角关闭X按钮
  3. 再次打开文本编辑器
  4. 保存这个临时文件
  5. 点击应用窗口右上角关闭X按钮
  6. 再次打开文本编辑器
  
  预期结果:
  1. 
  2. 
  3. 支持对该修改自动保存到应用的临时文件中
  4. 文件保存成功
  5. 
  6. 标签页恢复为关闭前的状态
module: "/V25_2500（测试部专用）/B类解耦商店应用/文本编辑器/工作区"
feature: "工作区"
tags:
  - L2
vars:
  xlsx_id: "050"
  case_type: "功能测试"

setup:
  - action: session_start
    command: "${APP_PATH}"
    wait: 1.0

teardown:
  - action: session_stop

steps:
  - name: "输入文本"
    action: keyboard_type
    text: "临时文件测试"
    wait: 0.3
  - name: "等待验证"
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: "deepin-editor"
