name: "字数展示_UI"
app: "deepin-editor"
screenshot: false
description: |
  测试步骤:
  1. 打开文本编辑器，默认新开空白文档
  2. 输入中文、英文、中英文标点符号及空格
  
  预期结果:
  1. 底栏上“字数”显示0
  2. “字数”跟随计数 ，每个字符都计入一个字
module: "/V25_2500（测试部专用）/B类解耦商店应用/文本编辑器/冒烟测试"
feature: "工作区"
tags:
  - L1
vars:
  xlsx_id: "043"
  case_type: "功能测试"

setup:
  - action: session_start
    command: "${APP_PATH}"
    wait: 1.0

teardown:
  - action: session_stop

steps:
  - name: "输入文本"
    action: keyboard_type
    text: "字数统计测试"
    wait: 3.0
  - name: "等待验证"
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: "deepin-editor"
