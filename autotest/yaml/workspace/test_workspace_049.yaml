name: "Tip框显示文件路径_长文件名"
app: "deepin-editor"
screenshot: false
description: |
  前置条件:
  文件名称长
  
  测试步骤:
  1. 使用文本编辑器打开文件
  2. 鼠标光标移动到标签页
  3. 切换系统字体为最大，鼠标移动到标签页
  4. 切换屏幕缩放比率，鼠标移动到标签页
  
  预期结果:
  1. 
  2. 弹出tip框显示文件路径+文件名称，显示无异常
  3. 弹出tip框显示文件路径+文件名称，显示无异常
  4. 弹出tip框显示文件路径+文件名称，显示无异常
module: "/V25_2500（测试部专用）/B类解耦商店应用/文本编辑器/工作区"
feature: "工作区"
tags:
  - L2
vars:
  xlsx_id: "049"
  case_type: "功能测试"

setup:
  - action: session_start
    command: "${APP_PATH}"
    wait: 1.0

teardown:
  - action: session_stop

steps:
  - name: "主菜单打开文件"
    action: main_menu_comb
    ref: menu_open_file
    wait: 1.0
  - name: "输入文件路径"
    action: keyboard_type
    text: "${TEST_FILES_DIR}/tip_test.txt"
    wait: 0.3
  - name: "回车打开"
    action: keyboard_press
    keys: "Return"
    wait: 1.0
  - name: "聚焦标签页区域"
    action: element_action
    ref: tab_bar
    do: focus
    wait: 1.0
  - name: "等待验证"
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: "deepin-editor"
