name: "打印预览2.0接口_存为PDF"
app: "deepin-editor"
screenshot: false
description: |
  测试步骤:
  1. 打开文本编辑器应用
  2. 主菜单/快捷键Ctrl+P 调用打印
  3. 切换“打印机”子菜单为“存为PDF”，进行保存
  4. 若修改当前文件（文档名前*显示），打印时选择“存为PDF”，进行保存
  
  预期结果:
  1. 
  2. 显示打印预览2.0的接口
  3. 默认当前文件名+后缀名.pdf
  4. 默认当前文件名+后缀名.pdf
module: "/V25_2500（测试部专用）/B类解耦商店应用/文本编辑器/工作区"
feature: "工作区"
tags:
  - L2
vars:
  xlsx_id: "052"
  case_type: "功能测试"

setup:
  - action: session_start
    command: "${APP_PATH}"
    wait: 1.0

teardown:
  - action: session_stop

steps:
  - name: "主菜单打印"
    action: main_menu_comb
    ref: menu_print
    wait: 1.0
  - name: "选择存为PDF"
    action: keyboard_type
    text: "pdf"
    wait: 0.3
  - name: "等待验证"
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: "deepin-editor"
