name: "文件查找【快捷键】"
app: "deepin-editor"
screenshot: false
description: |
  测试步骤:
  1. 任意打开一个TXT文件，然后按Ctrl+F键，查看软件显示
  2. 弹出查询菜单后，按Ctrl+T新建标签，查看查询菜单显示
  3. 弹出查询菜单后，按Ctrl+N新建窗口，查看查询菜单显示
  4. 弹出查询窗口后，按ESC键，查看软件显示
  5. 弹出查询窗口后，点击×按钮，查看软件显示
  6. 弹出查询窗口后，不输入任何字符，直接点击下一个/上一个，查看软件显示
  7. 弹出查询窗口后，输入任意字符，查看软件显示
  8. 弹出查询窗口后，输入文件中含有的字符，查看软件显示
  9. 假如只查找到一个字符，点击下一个/上一个按钮，查看软件显示
  10. 假如只查找到多个字符，点击下一个按钮，查看软件显示
  11. 假如只查找到多个字符，点击上一个按钮，查看软件显示
  12. 在查询输入框中输入大写字符，小写字符，查看能否正常查询
  
  预期结果:
  1. 软件会自动弹出查询菜单
  2. 软件会切换到新标签，查询菜单会自动退出
  3. 软件会切换到新窗口，原窗口的查询菜单依然显示
  4. 查询窗口自动退出
  5. 查询窗口自动退出
  6. 软件无任何显示，点击按钮无任何反应
  7. 搜索结果为空，不显示任何数据
  8. 软件会自动显示已经查找到的字符,用其他颜色进行匹配
  9. 按钮没有任何效果，只会显示那一个字符
  10. 软件会依次向下查询字符，查询到低后，再次点击下一个按钮，会自动跳转到第一个字符，再次循环查询
  11. 软件会依次向上查询字符，查询到最开始，再次点击上一个按钮，会自动跳转到最后一个字符，再次循环查询
  12. 软件会自动匹配字符大小写，都可以正常查询（实际结果请follow 需求 ）
module: "/V25_2500（测试部专用）/B类解耦商店应用/文本编辑器/工作区"
feature: "快捷键"
tags:
  - L2
vars:
  xlsx_id: "086"
  case_type: "功能测试"

setup:
  - action: session_start
    command: "${APP_PATH}"
    wait: 1.0

teardown:
  - action: session_stop

steps:
  - name: "输入文本"
    action: keyboard_type
    text: "查找快捷键测试test"
    wait: 0.3
  - name: "Ctrl+F快捷键"
    action: keyboard_hot_key
    keys: "ctrl,f"
    wait: 0.5
  - name: "输入查找词"
    action: element_set_value
    ref: find_input
    text: "test"
    wait: 0.3
  - name: "等待验证"
    action: wait
    wait: 0.3
    assert:
      - type: element_visible
        selector:
          name: "查找"
