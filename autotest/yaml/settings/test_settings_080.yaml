name: "Tab字符宽度_首行的显示"
app: "deepin-editor"
screenshot: false
description: |
  测试步骤:
  1. 打开文本编辑器设置不同的Tab字符宽度（重点在最小，最大值）
  2. 在文本编辑区键入tab 键，回车换行后继续键入tab键
  
  预期结果:
  1. 
  2. 首行和其他行都显示正常
module: "/V25_2500（测试部专用）/B类解耦商店应用/文本编辑器/主菜单"
feature: "设置"
tags:
  - L2
vars:
  xlsx_id: "080"
  case_type: "功能测试"

setup:
  - action: session_start
    command: "${APP_PATH}"
    wait: 1.0

teardown:
  - action: session_stop

steps:
  - name: "主菜单打开设置"
    action: main_menu_comb
    ref: menu_settings
    wait: 0.5
  - name: "修改Tab宽度首行"
    action: keyboard_type
    text: "8"
    wait: 0.3
  - name: "等待验证"
    action: wait
    wait: 0.3
    assert:
      - type: element_visible
        selector:
          name: "设置"
