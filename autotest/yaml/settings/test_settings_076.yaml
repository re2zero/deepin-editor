name: "显示行号"
app: "deepin-editor"
screenshot: false
description: |
  测试步骤:
  1. 打开编辑器，查看软件显示
  2. 在主菜单打开设置界面，查看软件显示
  3. 在设置界面取消“显示行号”的勾选状态，查看软件显示
  
  预期结果:
  1. 左侧默认显示行号
  2. “显示行号”默认勾选状态
  3. 左侧不显示行号
module: "/V25_2500（测试部专用）/B类解耦商店应用/文本编辑器/冒烟测试"
feature: "设置"
tags:
  - L2
vars:
  xlsx_id: "076"
  case_type: "功能测试"

setup:
  - action: session_start
    command: "${APP_PATH}"
    wait: 1.0

teardown:
  - action: session_stop

steps:
  - name: "主菜单打开设置"
    action: main_menu_comb
    ref: menu_settings
    wait: 0.5
  - name: "切换显示行号"
    action: keyboard_press
    keys: "space"
    wait: 0.3
  - name: "等待验证"
    action: wait
    wait: 0.3
    assert:
      - type: element_visible
        selector:
          name: "设置"
