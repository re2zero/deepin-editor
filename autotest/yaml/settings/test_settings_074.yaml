name: "恢复默认"
app: "deepin-editor"
screenshot: false
description: |
  测试步骤:
  1. 在设置中进行任意设置，然后点击恢复默认设置，查看软件显示
  
  预期结果:
  1. 所有设置都被恢复成默认设置
module: "/V25_2500（测试部专用）/B类解耦商店应用/文本编辑器/主菜单"
feature: "设置"
tags:
  - L2
vars:
  xlsx_id: "074"
  case_type: "功能测试"

setup:
  - action: session_start
    command: "${APP_PATH}"
    wait: 1.0

teardown:
  - action: session_stop

steps:
  - name: "主菜单打开设置"
    action: main_menu_comb
    ref: menu_settings
    wait: 0.5
  - name: "点击恢复默认"
    action: keyboard_press
    keys: "Tab"
    wait: 0.3
  - name: "等待验证"
    action: wait
    wait: 0.3
    assert:
      - type: element_visible
        selector:
          name: "设置"
