name: "键盘映射"
app: "deepin-editor"
screenshot: false
description: |
  测试步骤:
  1. 在键盘映射中共有三种方式可供选择，查看软件显示
  2. 选中标准模式后，查看快捷键显示
  3. 假如手动修改快捷键后，查看软件显示
  4. 选中Emacs模式，查看快捷键显示
  5. 分别使用标准，emacs，自定义三种模式快捷键操作编辑器
  
  预期结果:
  1. 分别是标准，emacs，自定义
  2. 软件会自动显示默认标准快捷键显示
  3. 软件会自动跳转到自定义模式
  4. 快捷键和标准模式不同，但仍然可以正常使用
  5. 三种模式都可以正常操作
module: "/V25_2500（测试部专用）/B类解耦商店应用/文本编辑器/主菜单"
feature: "设置"
tags:
  - L2
vars:
  xlsx_id: "071"
  case_type: "功能测试"

setup:
  - action: session_start
    command: "${APP_PATH}"
    wait: 1.0

teardown:
  - action: session_stop

steps:
  - name: "主菜单打开设置"
    action: main_menu_comb
    ref: menu_settings
    wait: 0.5
  - name: "切换键盘映射"
    action: keyboard_press
    keys: "Tab"
    wait: 0.3
  - name: "等待验证"
    action: wait
    wait: 0.3
    assert:
      - type: element_visible
        selector:
          name: "设置"
