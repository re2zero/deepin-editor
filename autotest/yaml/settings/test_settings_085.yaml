name: "设置【快捷键】"
app: "deepin-editor"
screenshot: false
description: |
  测试步骤:
  1. F1打开帮助手册
  2. Ctrl+Shift+/显示快捷键预览
  
  预期结果:
  1. 可以打开帮助手册
  2. 可以显示快捷键预览
module: "/V25_2500（测试部专用）/B类解耦商店应用/文本编辑器/冒烟测试"
feature: "设置"
tags:
  - L2
vars:
  xlsx_id: "085"
  case_type: "功能测试"

setup:
  - action: session_start
    command: "${APP_PATH}"
    wait: 1.0

teardown:
  - action: session_stop

steps:
  - name: "主菜单打开设置"
    action: main_menu_comb
    ref: menu_settings
    wait: 0.5
  - name: "查看快捷键设置"
    action: keyboard_press
    keys: "Tab"
    wait: 0.3
  - name: "等待验证"
    action: wait
    wait: 0.3
    assert:
      - type: element_visible
        selector:
          name: "设置"
