name: "【快捷键优化】“重做”快捷键恢复为“Ctrl+Y”"
app: "deepin-editor"
screenshot: false
description: |
  测试步骤:
  1. 打开文本编辑器，任意操作，如删除一行文字
  2. 撤销（Ctrl +Z)
  3. 重做Ctrl+Y
  4. Shift+Ctrl+? 调出快捷键页面
  5. 进入文本编辑器的设置页
  
  预期结果:
  1. 操作成功
  2. 恢复Step1之前的状态
  3. 恢复Step2的操作结果
  4. 重做的快捷键为Ctrl+Y
  5. 重做的快捷键默认为Ctrl+Y
module: "/V25_2500（测试部专用）/B类解耦商店应用/文本编辑器/工作区"
feature: "设置"
tags:
  - L2
vars:
  xlsx_id: "053"
  case_type: "功能测试"

setup:
  - action: session_start
    command: "${APP_PATH}"
    wait: 1.0

teardown:
  - action: session_stop

steps:
  - name: "主菜单打开设置"
    action: main_menu_comb
    ref: menu_settings
    wait: 0.5
  - name: "恢复默认快捷键"
    action: keyboard_press
    keys: "Tab"
    wait: 0.3
  - name: "Ctrl+Y测试"
    action: keyboard_hot_key
    keys: "ctrl,y"
    wait: 0.3
  - name: "等待验证"
    action: wait
    wait: 0.3
    assert:
      - type: element_visible
        selector:
          name: "设置"
