name: "字号大小设置"
app: "deepin-editor"
screenshot: false
description: |
  测试步骤:
  1. 打开设置窗口后，选中字体样式，任意切换字体大小，查看软件显示
  2. 查看字体最大最小设置显示
  
  预期结果:
  1. 字体大小切换成功，在软件中显示正确
  2. 字体最小设置显示为8，最大设置显示为50。默认字号12px；
module: "/V25_2500（测试部专用）/B类解耦商店应用/文本编辑器/冒烟测试"
feature: "设置"
tags:
  - L2
vars:
  xlsx_id: "070"
  case_type: "功能测试"

setup:
  - action: session_start
    command: "${APP_PATH}"
    wait: 1.0

teardown:
  - action: session_stop

steps:
  - name: "主菜单打开设置"
    action: main_menu_comb
    ref: menu_settings
    wait: 0.5
  - name: "修改字号"
    action: keyboard_type
    text: "18"
    wait: 0.3
  - name: "等待验证"
    action: wait
    wait: 0.3
    assert:
      - type: element_visible
        selector:
          name: "设置"
