name: "语音朗读/语音听写-未安装uos-ai"
app: "deepin-editor"
screenshot: false
description: |
  前置条件:
  1.打开文本编辑，且存在文本内容
  2.已卸载UOS-AI
  
  测试步骤:
  1. 选择一段文字，鼠标右键，点击语音朗读
  2. 空白处，鼠标右键，点击语音听写
  
  预期结果:
  1. 提示“请前往应用商店安装“UOS AI”后再使用”
  2. 提示“请前往应用商店安装“UOS AI”后再使用”
module: "/V25_2500（测试部专用）/B类解耦商店应用/文本编辑器"
feature: "语音功能"
tags:
  - L1
vars:
  xlsx_id: "010"
  case_type: "功能测试"

setup:
  - action: session_start
    command: "${APP_PATH}"
    wait: 1.0

teardown:
  - action: session_stop

steps:
  - name: "输入测试文本"
    action: keyboard_type
    text: "测试语音功能"
    wait: 0.3
  - name: "Ctrl+A全选"
    action: keyboard_hot_key
    keys: "ctrl,a"
    wait: 0.3
  - name: "右键点击语音朗读"
    action: context_menu_comb
    ref: ctx_voice_read
    wait: 1.0
  - name: "右键点击语音听写"
    action: context_menu_comb
    ref: ctx_dictation
    wait: 1.0
  - name: "等待验证"
    action: wait
    wait: 0.3
    assert:
      - type: ocr_exist
        text: "UOS AI"
