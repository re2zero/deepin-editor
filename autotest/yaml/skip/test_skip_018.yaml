name: "【玲珑】【文本编辑器】检查玲珑应用运行情况"
app: "deepin-editor"
screenshot: false
description: |
  前置条件:
  1. 已经运行玲珑应用
  
  测试步骤:
  1. 在终端执行命令：ll-cli ps
  
  预期结果:
  1. 可以查看到【文本编辑器】的运行情况，包含：应用名称、容器ID、进程ID
module: "/V25_2500（测试部专用）/B类解耦商店应用/文本编辑器/冒烟测试"
feature: "跳过"
tags:
  - L3
vars:
  xlsx_id: "018"
  case_type: "功能测试"

# NON-AUTOMATABLE: skip-玲珑环境不支持自动化
skip: "skip-玲珑环境不支持自动化"

setup:
  - action: session_start
    command: "${APP_PATH}"
    wait: 1.0

steps:
  - name: "跳过 - 【玲珑】【文本编辑器】检查玲珑应用运行情况"
    action: wait
    wait: 0.1

teardown:
  - action: session_stop
