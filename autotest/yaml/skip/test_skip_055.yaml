name: "软件启动"
app: "deepin-editor"
screenshot: false
description: |
  测试步骤:
  1. 软件安装成功后，在启动器中查看是否有软件图标
  2. 在启动器中双击编辑器图标，查看软件显示
  3. 启动器中右键打开编辑器
  4. 在启动器中输入“编辑器”进行搜索该软件，查看是否可以搜索成功
  5. 启动器右键发送到dock，查看软件显示
  6. 软件图标发送到dock成功后，用鼠标点击dock上的图标，查看软件显示
  7. 启动器右键发送到桌面，点击桌面图标打开编辑器
  8. 通过终端命令打开编辑器　deepin-editor
  9. 在启动器中设置设置该软件为开启启动，重启PC机，查看软件显示
  
  预期结果:
  1. 在启动器中有安装图标
  2. 软件会自动启动，弹出对话框显示该软件的主界面
  3. 正常打开
  4. 可以正常搜索到该软件
  5. 软件图标可以正常发送到dock
  6. 软件会自动启动，弹出对话框显示该软件的主界面
  7. 正常打开，没有报错
  8. 正常打开，没有报错
  9. 软件会随着系统启动而启动
module: "/V25_2500（测试部专用）/B类解耦商店应用/文本编辑器/安装/卸载/启动/关机"
feature: "跳过"
tags:
  - L1
vars:
  xlsx_id: "055"
  case_type: "功能测试"

# NON-AUTOMATABLE: skip-重启类场景需要letmego支持
skip: "skip-重启类场景需要letmego支持"

setup:
  - action: session_start
    command: "${APP_PATH}"
    wait: 1.0

steps:
  - name: "跳过 - 软件启动"
    action: wait
    wait: 0.1

teardown:
  - action: session_stop
