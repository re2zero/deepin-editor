skip: "skip-玲珑环境不支持自动化"

setup:
  - action: session_start
    command: "${APP_PATH}"
    wait: 1.0

steps:
  - name: "跳过 - 【玲珑】【文本编辑器】玲珑应用，基本功能测试"
    action: wait
    wait: 0.1

