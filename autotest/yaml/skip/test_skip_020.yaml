  2. 功能正常
  3. 功能正常
  4. 功能正常
module: "/V25_2500（测试部专用）/B类解耦商店应用/文本编辑器"
feature: "跳过"
tags:
  - L2
vars:
  xlsx_id: "020"
  case_type: "功能测试"

