name: "一指双击"
app: "deepin-editor"
screenshot: false
description: |
  测试步骤:
  1. 在文本管理器页面中通过触控板上使用一指手势移动光标至任意文字行，双击
  2. 在文件列表中通过触控板上使用一指手势双击文件
  
  预期结果:
  1. 选中当前行的全部内容
  2. 可调用文本编辑器打开该文件
module: "/V25_2500（测试部专用）/B类解耦商店应用/文本编辑器/硬件交互"
feature: "跳过"
tags:
  - L1
vars:
  xlsx_id: "143"
  case_type: "功能测试"

# NON-AUTOMATABLE: skip-触摸操作无法自动化
skip: "skip-触摸操作无法自动化"

setup:
  - action: session_start
    command: "${APP_PATH}"
    wait: 1.0

steps:
  - name: "跳过 - 一指双击"
    action: wait
    wait: 0.1

teardown:
  - action: session_stop
