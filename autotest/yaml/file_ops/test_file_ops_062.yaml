name: "打开无效文件"
app: "deepin-editor"
screenshot: false
description: |
  测试步骤:
  1. 将一个mp3文件拖拽到编辑器中，查看软件显示
  2. 将一个mp4文件拖拽到编辑器中，查看软件显示
  3. 将一个jpg文件拖拽到编辑器中，查看软件显示
  4. 将一个doc文件拖拽到编辑器中，查看软件显示
  
  预期结果:
  1. 软件给出提示信息，无效文档
  2. 软件给出提示信息，无效文档
  3. 软件给出提示信息，无效文档
  4. 软件给出提示信息，无效文档
module: "/V25_2500（测试部专用）/B类解耦商店应用/文本编辑器/工作区"
feature: "文件操作"
tags:
  - L3
vars:
  xlsx_id: "062"
  case_type: "功能测试"

setup:
  - action: session_start
    command: "${APP_PATH}"
    wait: 1.0

teardown:
  - action: session_stop

steps:
  - name: "主菜单打开文件"
    action: main_menu_comb
    ref: menu_open_file
    wait: 1.0
  - name: "输入无效文件路径"
    action: keyboard_type
    text: "/nonexistent/file.txt"
    wait: 0.3
  - name: "回车确认"
    action: keyboard_press
    keys: "Return"
    wait: 1.0
  - name: "等待验证"
    action: wait
    wait: 0.3
    assert:
      - type: ocr_exist
        text: "错误"
