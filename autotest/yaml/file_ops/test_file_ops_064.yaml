name: "打开GB18030编码方式文件"
app: "deepin-editor"
screenshot: false
description: |
  前置条件:
  1.参考标准《GB18030-2005.pdf》
  2.准备GB18030标准样例文件
  
  测试步骤:
  1. 打开GB18030标准样例文件，查看编码格式显示
  
  预期结果:
  1. double1,double2,double3,double4,double5,four, use1,use2,use3第一时间应被识别为GB18030 ；若未被识别，可手动切换为GB18030
module: "/V25_2500（测试部专用）/B类解耦商店应用/文本编辑器/工作区"
feature: "文件操作"
tags:
  - L1
vars:
  xlsx_id: "064"
  case_type: "功能测试"

setup:
  - action: session_start
    command: "${APP_PATH}"
    wait: 1.0

teardown:
  - action: session_stop

steps:
  - name: "主菜单打开GB18030文件"
    action: main_menu_comb
    ref: menu_open_file
    wait: 1.0
  - name: "输入文件路径"
    action: keyboard_type
    text: "${TEST_FILES_DIR}/gb18030.txt"
    wait: 0.3
  - name: "回车打开"
    action: keyboard_press
    keys: "Return"
    wait: 1.0
  - name: "等待验证"
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: "deepin-editor"
