name: "打开大文件_1G +"
app: "deepin-editor"
screenshot: false
description: |
  测试步骤:
  1. 使用文本编辑器打开大文件(1G , 1.2G ,1.5G ... )
  
  预期结果:
  1. 支持正常打开 ，应用不会闪退 （参考竞品机的打开情况）
module: "/V25_2500（测试部专用）/B类解耦商店应用/文本编辑器/工作区"
feature: "文件操作"
tags:
  - L2
vars:
  xlsx_id: "068"
  case_type: "功能测试"

setup:
  - action: session_start
    command: "${APP_PATH}"
    wait: 1.0

teardown:
  - action: session_stop

steps:
  - name: "主菜单打开大文件"
    action: main_menu_comb
    ref: menu_open_file
    wait: 2.0
  - name: "输入大文件路径"
    action: keyboard_type
    text: "${TEST_FILES_DIR}/large_1G.txt"
    wait: 0.3
  - name: "回车打开"
    action: keyboard_press
    keys: "Return"
    wait: 3.0
  - name: "等待验证"
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: "deepin-editor"
