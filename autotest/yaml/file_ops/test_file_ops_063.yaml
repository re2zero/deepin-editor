name: "打开U盘硬盘smb文件"
app: "deepin-editor"
screenshot: false
description: |
  测试步骤:
  1. 在U盘中使用编辑器打开文本文档，查看软件显示
  2. 在硬盘中使用编辑器打开文本文档，查看软件显示
  3. 在smb中使用编辑器打开文本文档，查看软件显示
  
  预期结果:
  1. 软件可以正常打开文档
  2. 软件可以正常打开文档
  3. 软件可以正常打开文档
module: "/V25_2500（测试部专用）/B类解耦商店应用/文本编辑器/工作区"
feature: "文件操作"
tags:
  - L2
vars:
  xlsx_id: "063"
  case_type: "功能测试"

setup:
  - action: session_start
    command: "${APP_PATH}"
    wait: 1.0

teardown:
  - action: session_stop

steps:
  - name: "主菜单打开文件"
    action: main_menu_comb
    ref: menu_open_file
    wait: 1.0
  - name: "输入U盘文件路径"
    action: keyboard_type
    text: "/media/usb/test.txt"
    wait: 0.3
  - name: "回车打开"
    action: keyboard_press
    keys: "Return"
    wait: 1.0
  - name: "等待验证"
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: "deepin-editor"
