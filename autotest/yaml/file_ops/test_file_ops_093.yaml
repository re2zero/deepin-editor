name: "保存"
app: "deepin-editor"
screenshot: false
description: |
  测试步骤:
  1. 任意打开一个TXT文件，然后修改数据后，点击主菜单的保存按钮，查看软件显示
  2. 任意新打开一个窗口或一个标签，输入字符后，点击保存按钮
  
  预期结果:
  1. 文件会自动保存，文件保存时软件会有提示信息，文件已保存
  2. 软件会弹出文件保存对话框，可以将文件进行保存
module: "/V25_2500（测试部专用）/B类解耦商店应用/文本编辑器/主菜单"
feature: "文件操作"
tags:
  - L2
vars:
  xlsx_id: "093"
  case_type: "功能测试"

setup:
  - action: session_start
    command: "${APP_PATH}"
    wait: 1.0

teardown:
  - action: session_stop

steps:
  - name: "输入文本"
    action: keyboard_type
    text: "测试保存"
    wait: 0.3
  - name: "主菜单保存"
    action: main_menu_comb
    ref: menu_save
    wait: 0.5
  - name: "等待验证"
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: "deepin-editor"
