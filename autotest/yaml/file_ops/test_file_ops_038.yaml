name: "记住最后的操作路径_保存一个未保存过的新文档"
app: "deepin-editor"
screenshot: false
description: |
  前置条件:
  存在最后的操作路径，比如 “下载 ”路径下
  
  测试步骤:
  1. 在文本编辑器的空白标签页中进行编辑并保存
  
  预期结果:
  1. 存储路径为上次的操作路径（“下载 ”路径）
module: "/V25_2500（测试部专用）/B类解耦商店应用/文本编辑器/主菜单"
feature: "文件操作"
tags:
  - L1
vars:
  xlsx_id: "038"
  case_type: "功能测试"

setup:
  - action: session_start
    command: "${APP_PATH}"
    wait: 1.0

teardown:
  - action: session_stop

steps:
  - name: "主菜单打开文件"
    action: main_menu_comb
    ref: menu_open_file
    wait: 1.0
  - name: "输入文件路径"
    action: keyboard_type
    text: "${TEST_FILES_DIR}/test1.txt"
    wait: 0.3
  - name: "回车打开"
    action: keyboard_press
    keys: "Return"
    wait: 1.0
  - name: "主菜单保存"
    action: main_menu_comb
    ref: menu_save
    wait: 0.5
  - name: "等待验证"
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: "deepin-editor"
