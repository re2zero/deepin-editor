name: "【bug转用例】修改编辑保存bashrc文件"
app: "deepin-editor"
screenshot: false
description: |
  前置条件:
  桌面存在bashrc文件
  
  测试步骤:
  1. 打开bashrc文件，修改任意信息，保存文本
  
  预期结果:
  1. 保存成功
module: "/V25_2500（测试部专用）/B类解耦商店应用/文本编辑器"
feature: "文件操作"
tags:
  - L3
vars:
  xlsx_id: "001"
  case_type: "功能测试"

setup:
  - action: session_start
    command: "${APP_PATH}"
    wait: 1.0

teardown:
  - action: session_stop

steps:
  - name: "主菜单打开文件"
    action: main_menu_comb
    ref: menu_open_file
    wait: 1.0
  - name: "输入文件路径"
    action: keyboard_type
    text: "${TEST_FILES_DIR}/.bashrc"
    wait: 0.3
  - name: "回车打开"
    action: keyboard_press
    keys: "Return"
    wait: 1.0
  - name: "修改文件内容"
    action: keyboard_type
    text: "# test comment"
    wait: 0.3
  - name: "Ctrl+S保存"
    action: keyboard_hot_key
    keys: "ctrl,s"
    wait: 0.5
  - name: "等待验证"
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: "deepin-editor"
