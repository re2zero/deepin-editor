name: "与当前文件保存一致_首次打开新文件"
app: "deepin-editor"
screenshot: false
description: |
  前置条件:
  创造首次打开的场景：rm -r ~/.config/deepin/deepin-editor/config.conf
  
  测试步骤:
  1. 进入文本编辑器设置中切换 “打开/保存位置”项的属性为“与当前文件保存一致”
  2. 主菜单打开/Ctrl+O
  
  预期结果:
  1. “与当前文件保存一致”前高亮选中
  2. 打开的默认路径为 系统-文档 路径
module: "/V25_2500（测试部专用）/B类解耦商店应用/文本编辑器/冒烟测试"
feature: "文件操作"
tags:
  - L1
vars:
  xlsx_id: "039"
  case_type: "功能测试"

setup:
  - action: session_start
    command: "${APP_PATH}"
    wait: 1.0

teardown:
  - action: session_stop

steps:
  - name: "主菜单打开文件"
    action: main_menu_comb
    ref: menu_open_file
    wait: 1.0
  - name: "输入文件路径"
    action: keyboard_type
    text: "${TEST_FILES_DIR}/test1.txt"
    wait: 0.3
  - name: "回车打开"
    action: keyboard_press
    keys: "Return"
    wait: 1.0
  - name: "主菜单保存"
    action: main_menu_comb
    ref: menu_save
    wait: 0.5
  - name: "等待验证"
    action: wait
    wait: 0.3
    assert:
      - type: process_running
        app: "deepin-editor"
